# SimVision-inspired theme
# Colors inspired by Cadence SimVision waveform viewer

foreground = "1e1e1e"
alt_text_color = "c8c8c8"
border_color = "909090"
selected_elements_colors = { background = "316ac5", foreground = "ffffff" }
canvas_colors = { background = "000000", alt_background = "080808", foreground = "c8c8c8" }
primary_ui_color = { background = "c8c8c8", foreground = "1e1e1e" }
secondary_ui_color = { background = "d0d0d0", foreground = "1e1e1e" }
accent_info = { background = "cc6600", foreground = "ffffff" }
accent_warn = { background = "cc6600", foreground = "ffffff" }
accent_error = { background = "cc2200", foreground = "ffffff" }
clock_highlight_line = { color = "224422", width = 2 }
clock_highlight_line_colors = [
    "224422",
    "442244",
    "222244",
    "444422",
    "442222",
    "224444",
]
clock_highlight_cycle = "050805"
clock_highlight_cycle_colors = [
    "050805",
    "080508",
    "050508",
    "080805",
    "080505",
    "050808",
]
clock_rising_marker = false
variable_default = "00cc00"
variable_undef = "ff4040"
variable_highimp = "cccc00"
variable_dontcare = "4466ff"
variable_weak = "808080"
variable_parameter = "1e1e1e"
variable_event = "88ccff"
transaction_default = "00cc00"
waveform_opacity = 0.15
wide_opacity = 0.0
cursor = { color = "ff2020", width = 2 }
gesture = { color = "ffff00", width = 2 }
measure = { color = "808080", width = 2 }
annotation_rectangle = { color = "ffcc00", width = 2 }
annotation_arrow = { color = "ffcc00", width = 2 }
linewidth = 2
thick_linewidth = 4
vector_transition_width = 6
alt_frequency = 3
viewport_separator = { color = "606060", width = 4 }
drag_threshold = 1.0
drag_hint_color = "bfbfbf"
drag_hint_width = 2.0
highlight_background = "0a1e0a"

[colors]
Green = "00cc00"
Red = "ff4040"
Yellow = "cccc00"
Blue = "4488cc"
Pink = "cc88cc"
Orange = "cc8844"
Gray = "808080"
Violet = "8888cc"

[ticks]
style = { color = "333333", width = 2 }
density = 1

[relation_arrow]
style = { color = "cc2020", width = 1.3 }
head_angle = 25
head_length = 8
